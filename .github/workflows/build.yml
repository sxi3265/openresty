name: Build and test images

on:
  workflow_call:
    inputs:
      resty_version:
        required: true
        type: string
      resty_release:
        required: true
        type: string
      version:
        required: true
        type: string

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build debug test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          build-args: |
            RESTY_VERSION=${{ inputs.resty_version }}
            RESTY_RELEASE=${{ inputs.resty_release }}
            RESTY_DEBUG_OPTIONS=--with-debug
          tags: openresty-patch-test:${{ inputs.version }}-${{ matrix.suffix }}

      - name: Verify debug test image
        shell: bash
        env:
          TEST_IMAGE: openresty-patch-test:${{ inputs.version }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bash util/ci/verify-image.sh debug "$TEST_IMAGE"

      - name: Assemble and run patch tests
        shell: bash
        env:
          TEST_IMAGE: openresty-patch-test:${{ inputs.version }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bash util/ci/run-patch-tests.sh "$TEST_IMAGE"

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          provenance: false
          build-args: |
            RESTY_VERSION=${{ inputs.resty_version }}
            RESTY_RELEASE=${{ inputs.resty_release }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}

      - name: Verify production image
        shell: bash
        env:
          PRODUCTION_IMAGE: ${{ env.GHCR_IMAGE }}:${{ inputs.version }}-${{ matrix.suffix }}
        run: |
          set -euo pipefail
          bash util/ci/verify-image.sh production "$PRODUCTION_IMAGE"

      - name: Push architecture image
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH_SUFFIX: ${{ matrix.suffix }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          bash util/ci/push-architecture-images.sh "$VERSION" "$ARCH_SUFFIX"
