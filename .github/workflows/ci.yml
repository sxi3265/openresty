name: CI and publish

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - patches/**
      - conf/**
      - util/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read version and determine release
    runs-on: ubuntu-24.04
    outputs:
      resty_version: ${{ steps.version.outputs.RESTY_VERSION }}
      resty_release: ${{ steps.version.outputs.RESTY_RELEASE }}
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          bash util/ci/resolve-version.sh Dockerfile >> "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs:
      - prepare
    uses: ./.github/workflows/build.yml
    with:
      resty_version: ${{ needs.prepare.outputs.resty_version }}
      resty_release: ${{ needs.prepare.outputs.resty_release }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish manifests and release
    needs:
      - prepare
      - build
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
