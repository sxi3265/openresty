name: Publish release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: false
        type: string
        default: ""
      publish_manifests:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish or repair
        required: true
        type: string
      commit:
        description: Full commit SHA for the release tag
        required: true
        type: string
      publish_manifests:
        description: Recreate and publish container manifests
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  manifest:
    name: Publish multi-platform manifests
    if: inputs.publish_manifests
    runs-on: ubuntu-24.04

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifests
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${GHCR_IMAGE}:${VERSION}" \
            --tag "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${VERSION}-amd64" \
            "${GHCR_IMAGE}:${VERSION}-arm64"

  release:
    name: Publish tags and releases
    needs:
      - manifest
    if: >-
      always() &&
      (needs.manifest.result == 'success' || needs.manifest.result == 'skipped')
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish tag and GitHub release
        shell: bash
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists"
          else
            git tag "${VERSION}" "${COMMIT}"
            git push origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          fi

          bash util/ci/release-notes.sh "$COMMIT" "$VERSION" release-notes.md

          bash util/ci/publish-github-release.sh \
            "$VERSION" "$COMMIT" release-notes.md
